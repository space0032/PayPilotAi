spring:
  application:
    name: paypilot-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paypilot}
    username: ${DB_USER:paypilot}
    password: ${DB_PASSWORD:paypilot}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Hikari exposes these as raw millisecond longs - no duration suffix.
      connection-timeout: 3000
      validation-timeout: 1000

  jpa:
    # Schema is owned by Flyway migrations only. Hibernate may verify but never mutate it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # prometheus scrapes /actuator/prometheus; metrics for ad-hoc reads.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}
      show-components: ${HEALTH_SHOW_DETAILS:never}
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  # Business meters (payments captured/failed/refunded, agent tool calls,
  # consent decisions) are registered in code with the paypilot.* prefix.
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

paypilot:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-ttl-minutes: 15
    refresh-token:
      ttl-days: 7
    rate-limit:
      auth-capacity-per-minute: 10
  payments:
    # mock = local stand-in (no account needed); razorpay = live REST adapter.
    gateway: ${PAYMENTS_GATEWAY:mock}
    webhook-secret: ${PAYMENTS_WEBHOOK_SECRET:local-mock-whsec-change-me}
    # Unpaid attempts older than this are expired and their stock released.
    attempt-ttl-minutes: ${PAYMENTS_ATTEMPT_TTL_MINUTES:30}
    expiry-sweep-interval-ms: ${PAYMENTS_SWEEP_INTERVAL_MS:60000}
    razorpay:
      base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com/v1}
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}

  agent:
    # mock = deterministic scripted planner; live = LLM-driven decisions.
    planner: ${AGENT_PLANNER:mock}
    # Hard ceiling on any single purchase the agent may make.
    max-spend-paise: ${AGENT_MAX_SPEND_PAISE:1000000}
    # Rolling-24h ceiling across all of a user's sessions combined.
    daily-spend-cap-paise: ${AGENT_DAILY_SPEND_CAP_PAISE:2000000}
    # An unanswered consent ask expires after this window (terminal EXPIRED).
    consent-ttl-minutes: ${AGENT_CONSENT_TTL_MINUTES:30}
    consent-sweep-interval-ms: ${AGENT_CONSENT_SWEEP_INTERVAL_MS:60000}
    llm:
      # none = no LLM bean at all; openai-compatible = /chat/completions dialect
      # (OpenRouter and Ollama both speak it - see .env.example).
      provider: ${AGENT_LLM_PROVIDER:none}
      base-url: ${AGENT_LLM_BASE_URL:${OPENROUTER_BASE_URL:${OLLAMA_BASE_URL:https://api.openai.com/v1}}}
      api-key: ${AGENT_LLM_API_KEY:${OPENROUTER_API_KEY:}}
      model: ${AGENT_LLM_MODEL:${OPENROUTER_MODEL:${OLLAMA_MODEL:gpt-4o-mini}}}

logging:
  level:
    root: INFO
    com.paypilot: DEBUG
