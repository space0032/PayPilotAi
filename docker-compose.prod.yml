# Phase 17: production profile — the PayPilot app image built from the
# root Dockerfile, wired to the Postgres and Redis volumes the base
# compose already defines. Run with:
#
#   docker compose --profile prod -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Or more simply:
#
#   docker compose --profile prod up -d
#
# (Compose merges the two files automatically when both are present.)
#
# The base file stays dev-only: exposed ports, ephemeral data.
# This file keeps data volumes stable, hides internal services,
# and launches the built image.

services:
  postgres:
    # Inherit the base postgres service but drop the host port mapping
    # in production — the app container reaches it via the internal
    # compose network; nobody else should.
    ports: []

  redis:
    ports: []

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paypilot-app
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: "8080"
      PAYMENTS_GATEWAY: ${PAYMENTS_GATEWAY:-razorpay}
      PAYMENTS_WEBHOOK_SECRET: ${PAYMENTS_WEBHOOK_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_BASE_URL: ${RAZORPAY_BASE_URL:-https://api.razorpay.com/v1}
      JWT_SECRET: ${JWT_SECRET:-}
      AGENT_PLANNER: ${AGENT_PLANNER:-mock}
      AGENT_LLM_PROVIDER: ${AGENT_LLM_PROVIDER:-none}
      AGENT_LLM_BASE_URL: ${AGENT_LLM_BASE_URL:-}
      AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-gpt-4o-mini}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://paypilot.example.com}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
