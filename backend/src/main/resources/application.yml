spring:
  application:
    name: paypilot-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paypilot}
    username: ${DB_USER:paypilot}
    password: ${DB_PASSWORD:paypilot}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Hikari exposes these as raw millisecond longs - no duration suffix.
      connection-timeout: 3000
      validation-timeout: 1000

  jpa:
    # Schema is owned by Flyway migrations only. Hibernate may verify but never mutate it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}
      show-components: ${HEALTH_SHOW_DETAILS:never}
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

paypilot:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-ttl-minutes: 15
    refresh-token:
      ttl-days: 7
    rate-limit:
      auth-capacity-per-minute: 10

logging:
  level:
    root: INFO
    com.paypilot: DEBUG
