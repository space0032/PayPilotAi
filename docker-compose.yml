services:
  postgres:
    image: postgres:16-alpine
    container_name: paypilot-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-paypilot}
      POSTGRES_USER: ${DB_USER:-paypilot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-paypilot}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - paypilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-paypilot} -d ${DB_NAME:-paypilot}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: paypilot-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - paypilot_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  paypilot_pgdata:
  paypilot_redisdata:
