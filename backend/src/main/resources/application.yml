spring:
  application:
    name: paypilot-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paypilot}
    username: ${DB_USER:paypilot}
    password: ${DB_PASSWORD:paypilot}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Hikari exposes these as raw millisecond longs - no duration suffix.
      connection-timeout: 3000
      validation-timeout: 1000

  jpa:
    # Schema is owned by Flyway migrations only. Hibernate may verify but never mutate it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}
      show-components: ${HEALTH_SHOW_DETAILS:never}
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

paypilot:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-ttl-minutes: 15
    refresh-token:
      ttl-days: 7
    rate-limit:
      auth-capacity-per-minute: 10
  payments:
    # mock = local stand-in (no account needed); live adapter comes later.
    gateway: ${PAYMENTS_GATEWAY:mock}
    webhook-secret: ${PAYMENTS_WEBHOOK_SECRET:local-mock-whsec-change-me}
    # Unpaid attempts older than this are expired and their stock released.
    attempt-ttl-minutes: ${PAYMENTS_ATTEMPT_TTL_MINUTES:30}
    expiry-sweep-interval-ms: ${PAYMENTS_SWEEP_INTERVAL_MS:60000}

  agent:
    # mock = deterministic scripted planner; live = LLM-driven decisions.
    planner: ${AGENT_PLANNER:mock}
    # Hard ceiling on any single purchase the agent may make.
    max-spend-paise: ${AGENT_MAX_SPEND_PAISE:1000000}
    llm:
      # none = no LLM bean at all; openai-compatible = /chat/completions dialect.
      provider: ${AGENT_LLM_PROVIDER:none}
      base-url: ${AGENT_LLM_BASE_URL:https://api.openai.com/v1}
      api-key: ${AGENT_LLM_API_KEY:}
      model: ${AGENT_LLM_MODEL:gpt-4o-mini}

logging:
  level:
    root: INFO
    com.paypilot: DEBUG
