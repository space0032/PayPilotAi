services:
  postgres:
    image: postgres:16-alpine
    container_name: paypilot-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-paypilot}
      POSTGRES_USER: ${DB_USER:-paypilot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-paypilot}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - paypilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-paypilot} -d ${DB_NAME:-paypilot}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: paypilot-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - paypilot_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paypilot-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-paypilot}
      DB_USER: ${DB_USER:-paypilot}
      DB_PASSWORD: ${DB_PASSWORD:-paypilot}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-}
      PAYMENTS_GATEWAY: ${PAYMENTS_GATEWAY:-mock}
      PAYMENTS_WEBHOOK_SECRET: ${PAYMENTS_WEBHOOK_SECRET:-local-mock-whsec-change-me}
      RAZORPAY_BASE_URL: ${RAZORPAY_BASE_URL:-https://api.razorpay.com/v1}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      AGENT_PLANNER: ${AGENT_PLANNER:-mock}
      AGENT_LLM_PROVIDER: ${AGENT_LLM_PROVIDER:-none}
      AGENT_LLM_BASE_URL: ${AGENT_LLM_BASE_URL:-}
      AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-gpt-4o-mini}
      AGENT_MAX_SPEND_PAISE: ${AGENT_MAX_SPEND_PAISE:-1000000}
      AGENT_DAILY_SPEND_CAP_PAISE: ${AGENT_DAILY_SPEND_CAP_PAISE:-2000000}
      AGENT_CONSENT_TTL_MINUTES: ${AGENT_CONSENT_TTL_MINUTES:-30}
      CURRENCY_RATES: ${CURRENCY_RATES:-{}}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paypilot-frontend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  paypilot_pgdata:
  paypilot_redisdata:
